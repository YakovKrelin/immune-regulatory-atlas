name: BIOOS CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-and-verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }
          if (Test-Path "pyproject.toml") {
            pip install -e ".[test]" 2>$null
            if ($LASTEXITCODE -ne 0) {
              pip install -e .
            }
          }
          pip install fastapi uvicorn httpx pytest

      - name: Run pytest suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -v

      - name: Start Uvicorn and run BIOOS API checks
        env:
          PYTHONPATH: src
        run: |
          $port = 8010
          $baseUrl = "http://127.0.0.1:$port"
          $serverProc = Start-Process `
            -FilePath "python" `
            -ArgumentList "-m", "uvicorn", "bioos.main:app", "--host", "127.0.0.1", "--port", "$port" `
            -PassThru `
            -WindowStyle Hidden

          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $resp = Invoke-RestMethod "$baseUrl/health" -TimeoutSec 2
                if ($resp.status -eq "ok") {
                  $ready = $true
                  break
                }
              }
              catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) {
              throw "Uvicorn did not become ready at $baseUrl/health within 15 seconds."
            }

            & ".\scripts\run_bioos_checks.ps1" -BaseUrl $baseUrl -ProjectRoot (Get-Location).Path
          }
          finally {
            if ($serverProc -and -not $serverProc.HasExited) {
              Stop-Process -Id $serverProc.Id -Force -ErrorAction SilentlyContinue
            }
          }